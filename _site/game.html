<!DOCTYPE html>
<html>

<head>
    <title>3D Rolling Ball Pro</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        #score-box {
            position: absolute;
            top: 20px;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        #game-over-screen {
            pointer-events: auto;
            display: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff4444;
        }

        button {
            background: #ff4444;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ff6666;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div id="ui-layer">
        <div id="score-box">Score: 0</div>
        <div id="game-over-screen">
            <h1 style="color: #ff4444;">CRASHED</h1>
            <p id="final-score">Final Score: 0</p>
            <button onclick="resetGame()">RESTART</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- Configuration & Constants ---
        const INITIAL_SPEED = 0.4;
        const ACCELERATION = 0.0001;
        const OBSTACLE_COUNT = 25;
        const SPAWN_INTERVAL = 40;
        const JUMP_FORCE = 0.25;
        const GRAVITY = 0.01;
        const HORIZONTAL_SPEED = 0.1;
        const TRACK_WIDTH = 12;

        let scene, camera, renderer, clock;
        let player, obstacles = [], track;
        let score = 0, speed = INITIAL_SPEED, isDead = false;
        let playerVelocity = { x: 0, y: 0, z: 0 };
        let isJumping = false;
        let keysPressed = {};

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x1a1a1a, 15, 120);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
            const directional = new THREE.DirectionalLight(0xffffff, 0.5);
            directional.position.set(5, 10, 5);
            scene.add(ambient, hemi, directional);

            // Player setup (Rolling Ball)
            const playerGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const playerMat = new THREE.MeshPhongMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.3 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 0.5; // Raised slightly so it rolls *on* the track
            scene.add(player);

            // Track setup (Wider and infinitely scrolling)
            const trackGeo = new THREE.PlaneGeometry(TRACK_WIDTH, 2000);
            const trackMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
            track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            scene.add(track);

            spawnObstacles();
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, -5);

            window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);
            animate();
        }

        function createObstacle(zPos) {
            const types = [
                { geo: new THREE.BoxGeometry(1.5, 1, 1), color: 0xff4444 }, // Standard
                { geo: new THREE.CylinderGeometry(0.8, 0.8, 5, 16), color: 0xffaa00 }, // Pillar (Needs rotation)
                { geo: new THREE.BoxGeometry(TRACK_WIDTH, 1.2, 1), color: 0xaa00ff }  // Wide Bar
            ];
            const type = types[Math.floor(Math.random() * types.length)];
            const mesh = new THREE.Mesh(type.geo, new THREE.MeshPhongMaterial({ color: type.color }));

            // Adjust geometry parameters
            let height;
            if (type.geo.type === "CylinderGeometry") {
                height = type.geo.parameters.height;
                mesh.rotation.x = Math.PI / 2; // Lie pillars on their side
                mesh.position.y = type.geo.parameters.radiusTop;
            } else {
                height = type.geo.parameters.height;
                mesh.position.y = height / 2;
            }

            // Random horizontal position on the track
            const lanePadding = type.geo.parameters.width / 2 || type.geo.parameters.radiusTop;
            const spawnRange = TRACK_WIDTH / 2 - lanePadding;
            mesh.position.x = (Math.random() - 0.5) * spawnRange * 2;
            mesh.position.z = zPos;

            return mesh;
        }

        function spawnObstacles() {
            for (let i = 0; i < OBSTACLE_COUNT; i++) {
                const obs = createObstacle(-i * SPAWN_INTERVAL - 50);
                obstacles.push(obs);
                scene.add(obs);
            }
        }

        function handleInput() {
            if (isDead) return;

            // Continuous Horizontal Steering
            playerVelocity.x = 0;
            if (keysPressed['arrowleft'] || keysPressed['a']) playerVelocity.x = -HORIZONTAL_SPEED;
            if (keysPressed['arrowright'] || keysPressed['d']) playerVelocity.x = HORIZONTAL_SPEED;

            // Jump Handling
            if ((keysPressed[' '] || keysPressed['arrowup'] || keysPressed['w']) && !isJumping) {
                playerVelocity.y = JUMP_FORCE;
                isJumping = true;
            }
        }

        function resetGame() {
            location.reload();
        }
        window.resetGame = resetGame;

        function animate() {
            if (isDead) return;
            requestAnimationFrame(animate);
            handleInput();
            const delta = clock.getDelta();

            // 1. Acceleration (Forward movement)
            speed += ACCELERATION;

            // 2. Physics & Jump
            playerVelocity.y -= GRAVITY; // Apply gravity
            player.position.y += playerVelocity.y;
            player.position.x += playerVelocity.x;

            // Continuous Horizontal Constraint (Stay on track)
            const halfTrackWidth = TRACK_WIDTH / 2;
            const ballRadius = 0.5;
            player.position.x = THREE.MathUtils.clamp(player.position.x, -halfTrackWidth + ballRadius, halfTrackWidth - ballRadius);

            // Ground collision (Stop jumping)
            if (player.position.y <= ballRadius) {
                player.position.y = ballRadius;
                playerVelocity.y = 0;
                isJumping = false;
            }

            // 3. Roll Animation
            // Forward roll (driven by speed)
            player.rotation.x -= speed;
            // Side roll (driven by horizontal velocity)
            player.rotation.z -= playerVelocity.x * 2;

            // 4. Update Obstacles & Collision
            obstacles.forEach(obs => {
                obs.position.z += speed;

                // Recycling
                if (obs.position.z > 20) {
                    obs.position.z = -OBSTACLE_COUNT * SPAWN_INTERVAL;
                    // Re-randomize horizontal position
                    const padding = obs.geometry.parameters.width / 2 || obs.geometry.parameters.radiusTop;
                    const range = TRACK_WIDTH / 2 - padding;
                    obs.position.x = (Math.random() - 0.5) * range * 2;
                    score++;
                    document.getElementById('score-box').innerText = `Score: ${score}`;
                }

                // AABB Collision Detection
                const pBox = new THREE.Box3().setFromObject(player);
                const oBox = new THREE.Box3().setFromObject(obs);
                if (pBox.intersectsBox(oBox)) {
                    die();
                }
            });

            // Camera follow (shaky effect)
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x * 0.4, 0.1);

            renderer.render(scene, camera);
        }

        function die() {
            isDead = true;
            document.getElementById('game-over-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
        }

        init();
    </script>
</body>

</html>
