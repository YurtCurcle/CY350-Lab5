<!DOCTYPE html>
<html>

<head>
    <title>3D Downhill Roller Pro</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        #score-box {
            position: absolute;
            top: 20px;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        #game-over-screen {
            pointer-events: auto;
            display: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff4444;
            backdrop-filter: blur(5px);
        }

        button {
            background: #ff4444;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover {
            background: #ff6666;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div id="ui-layer">
        <div id="score-box">Distance: 0m</div>
        <div id="game-over-screen">
            <h1 style="color: #ff4444; margin-top: 0;">YOU FELL</h1>
            <p id="final-score" style="font-size: 24px;">Final Distance: 0m</p>
            <button onclick="resetGame()">RESTART</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- Physics & Game Constants ---
        const SLOPE_ANGLE = 0.15; // Radians (~8.5 degrees downhill)
        const TRACK_WIDTH = 14;
        const INITIAL_SPEED = 0.3;
        const FORWARD_ACCEL = 0.0003; // Accelerates much quicker now
        const H_ACCEL = 0.015; // Horizontal acceleration (steering weight)
        const H_FRICTION = 0.92; // Inertia/Slippery feel (1 = ice, 0.5 = glue)
        const GRAVITY = 0.015;
        const JUMP_FORCE = 0.28;
        const BALL_RADIUS = 0.5;

        let scene, camera, renderer, clock;
        let player;
        let score = 0, speed = INITIAL_SPEED, isDead = false;

        let vY = 0; // Vertical velocity
        let hVelocity = 0; // Horizontal velocity
        let isJumping = false;
        let keysPressed = {};

        // Procedural generation arrays
        let activePlatforms = [];
        let activeObstacles = [];
        let nextSpawnZ = 0; // Tracks where to build the next track segment

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.3);
            const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            const directional = new THREE.DirectionalLight(0xffffff, 0.6);
            directional.position.set(10, 20, 10);
            scene.add(ambient, hemi, directional);

            // Player setup
            const playerGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
            const playerMat = new THREE.MeshPhongMaterial({ color: 0x00ffcc, emissive: 0x0088aa, emissiveIntensity: 0.5 });
            player = new THREE.Mesh(playerGeo, playerMat);
            scene.add(player);

            window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

            // Pre-generate the first chunk of the world
            while (nextSpawnZ > -300) {
                spawnPlatform(nextSpawnZ === 0); // Force the first platform to be long and safe
            }

            animate();
        }

        function spawnPlatform(isFirst = false) {
            // Randomize platform length and gap size
            let length = isFirst ? 100 : (40 + Math.random() * 60);
            let gap = isFirst ? 0 : (8 + Math.random() * 10); // Gap before NEXT platform

            // Calculate downhill Y coordinates using trigonometry (y = z * tan(angle))
            let startY = nextSpawnZ * Math.tan(SLOPE_ANGLE);
            let endZ = nextSpawnZ - length;
            let endY = endZ * Math.tan(SLOPE_ANGLE);
            let centerY = (startY + endY) / 2;
            let centerZ = nextSpawnZ - length / 2;

            // Create Platform Mesh
            let geo = new THREE.BoxGeometry(TRACK_WIDTH, 1, length);
            let mat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
            let mesh = new THREE.Mesh(geo, mat);
            // Position mesh so its top surface perfectly aligns with our math
            mesh.position.set(0, centerY - 0.5, centerZ);
            mesh.rotation.x = SLOPE_ANGLE; // Tilt it downhill
            scene.add(mesh);

            activePlatforms.push({ mesh, startZ: nextSpawnZ, endZ: endZ });

            // Spawn Obstacles on this platform (skip first safe zone)
            if (!isFirst) {
                let obsCount = Math.floor(length / 25);
                for (let i = 0; i < obsCount; i++) {
                    let obsZ = nextSpawnZ - 10 - Math.random() * (length - 20);
                    let obsY = obsZ * Math.tan(SLOPE_ANGLE); // Match slope height
                    let obsX = (Math.random() - 0.5) * (TRACK_WIDTH - 3);

                    let oGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                    let oMat = new THREE.MeshPhongMaterial({ color: 0xff3366 });
                    let oMesh = new THREE.Mesh(oGeo, oMat);
                    oMesh.position.set(obsX, obsY + 0.75, obsZ);
                    oMesh.rotation.x = SLOPE_ANGLE;
                    scene.add(oMesh);
                    activeObstacles.push({ mesh: oMesh });
                }
            }

            // Update tracker for the next generation cycle
            nextSpawnZ = endZ - gap;
        }

        function handleInput() {
            if (isDead) return;

            // Apply Horizontal Acceleration (Inertia)
            if (keysPressed['arrowleft'] || keysPressed['a']) hVelocity -= H_ACCEL;
            if (keysPressed['arrowright'] || keysPressed['d']) hVelocity += H_ACCEL;

            // Apply Friction (This makes it feel "heavy" and slippery)
            hVelocity *= H_FRICTION;
            player.position.x += hVelocity;
        }

        function resetGame() { location.reload(); }
        window.resetGame = resetGame;

        function animate() {
            if (isDead) return;
            requestAnimationFrame(animate);
            handleInput();

            // 1. Forward Acceleration
            speed += FORWARD_ACCEL;
            player.position.z -= speed;

            // 2. Determine Ground Height (Raycast logic alternative)
            let onGround = false;
            let groundY = -Infinity; // Default to falling into the abyss

            for (let p of activePlatforms) {
                // Check if player's Z is within this platform's Z range
                if (player.position.z <= p.startZ && player.position.z >= p.endZ) {
                    // Check if player is within the X bounds (hasn't fallen off the side)
                    if (Math.abs(player.position.x) <= TRACK_WIDTH / 2) {
                        groundY = player.position.z * Math.tan(SLOPE_ANGLE);
                        onGround = true;
                        break;
                    }
                }
            }

            // 3. Gravity and Jumping
            vY -= GRAVITY;
            player.position.y += vY;

            // Collision with ground
            if (player.position.y <= groundY + BALL_RADIUS) {
                player.position.y = groundY + BALL_RADIUS;
                vY = 0;
                isJumping = false;
            }

            // Jump trigger
            if (onGround && !isJumping && (keysPressed[' '] || keysPressed['arrowup'] || keysPressed['w'])) {
                vY = JUMP_FORCE;
                isJumping = true;
            }

            // 4. Death Conditions
            // If the player falls 15 units below the expected slope height
            let expectedSlopeY = player.position.z * Math.tan(SLOPE_ANGLE);
            if (player.position.y < expectedSlopeY - 15) {
                die();
            }

            // Obstacle collision (using slightly shrunk hitboxes for fairness)
            let pBox = new THREE.Box3().setFromObject(player).expandByScalar(-0.1);
            for (let o of activeObstacles) {
                let oBox = new THREE.Box3().setFromObject(o.mesh);
                if (pBox.intersectsBox(oBox)) die();
            }

            // 5. Visual Roll Animation
            player.rotation.x -= speed;
            player.rotation.z -= hVelocity * 2;

            // 6. Camera Follow System (Smooth Lerp)
            let camTargetX = player.position.x * 0.5;
            let camTargetY = player.position.y + 5;
            let camTargetZ = player.position.z + 8;

            camera.position.x = THREE.MathUtils.lerp(camera.position.x, camTargetX, 0.1);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, camTargetY, 0.1);
            camera.position.z = camTargetZ; // Lock Z tightly so player doesn't outrun camera
            camera.lookAt(player.position.x, player.position.y - 2, player.position.z - 10);

            // 7. World Management (Infinite Runner Logic)
            // Generate new track ahead
            while (nextSpawnZ > player.position.z - 300) {
                spawnPlatform();
            }

            // Clean up old track pieces behind the camera to save GPU memory
            activePlatforms = activePlatforms.filter(p => {
                if (p.endZ > player.position.z + 50) { scene.remove(p.mesh); return false; }
                return true;
            });
            activeObstacles = activeObstacles.filter(o => {
                if (o.mesh.position.z > player.position.z + 50) { scene.remove(o.mesh); return false; }
                return true;
            });

            // Score update
            score = Math.floor(Math.abs(player.position.z) / 10);
            document.getElementById('score-box').innerText = `Distance: ${score}m`;

            renderer.render(scene, camera);
        }

        function die() {
            isDead = true;
            document.getElementById('game-over-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `Final Distance: ${score}m`;
        }

        init();
    </script>
</body>

</html>
